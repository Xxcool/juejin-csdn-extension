name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:zip
      - name: Generate formatted release notes
        run: node scripts/extract-release-notes.mjs "$GITHUB_REF_NAME" release/RELEASE_NOTES.md
      - name: Create or update GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "🚀 $GITHUB_REF_NAME" --notes-file release/RELEASE_NOTES.md --draft=false --latest
            gh release upload "$GITHUB_REF_NAME" release/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.zip --title "🚀 $GITHUB_REF_NAME" --notes-file release/RELEASE_NOTES.md --verify-tag --latest
          fi
        env:
          GH_TOKEN: ${{ github.token }}
