name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension zip package
        run: |
          npm run build:release
          node scripts/package-release.mjs
          mkdir -p docs/public/downloads
          LATEST_ZIP=$(ls -t release/article-ferry-v*.zip | head -n 1)
          cp "$LATEST_ZIP" docs/public/downloads/article-ferry-latest.zip
          cp release/article-ferry-v*.zip docs/public/downloads/

      - name: Build with VitePress
        env:
          VITEPRESS_BASE: /juejin-csdn-extension/
        run: npm run docs:build


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
