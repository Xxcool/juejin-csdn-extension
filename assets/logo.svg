<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="掘金同步助手">
  <!-- 品牌源图：渐变蓝底、文章页与顺时针同步箭头；圆角外保持透明。 -->
  <defs>
    <linearGradient id="syncGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009FFF"/>
      <stop offset="100%" stop-color="#1934D5"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#syncGradient)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 两段相连箭头的圆弧，共同表达文章同步。 -->
    <path d="M47 97 A37 37 0 0 1 74 29 M65 20 L74 29 L65 38"/>
    <path d="M81 31 A37 37 0 0 1 54 99 M63 90 L54 99 L63 108"/>
    <!-- 文章保留折角与两条正文线，减少小尺寸下的细节干扰。 -->
    <path d="M50 45 H70 L80 55 V79 Q80 83 76 83 H50 Q46 83 46 79 V49 Q46 45 50 45 Z"/>
    <path d="M70 45 V52 Q70 55 73 55 H80 M55 64 H71 M55 72 H71"/>
  </g>
</svg>
