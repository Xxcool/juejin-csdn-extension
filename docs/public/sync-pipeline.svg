<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7faff"/>
      <stop offset="1" stop-color="#edf3fb"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1e80ff"/>
      <stop offset="1" stop-color="#ef5361"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#73849a" flood-opacity=".18"/>
    </filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#647c9d"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg2)"/>
  <text x="100" y="105" fill="#17243a" font-size="52" font-weight="700" font-family="PingFang SC,Microsoft YaHei,sans-serif">一篇文章的“摆渡”链路</text>
  <text x="100" y="155" fill="#718098" font-size="24" font-family="PingFang SC,Microsoft YaHei,sans-serif">从用户明确触发，到 CSDN 草稿可检查，每一步都有状态和失败出口</text>

  <path d="M250 415H1350" fill="none" stroke="url(#line)" stroke-width="10" stroke-linecap="round" opacity=".28"/>
  <g fill="none" stroke="#647c9d" stroke-width="4" marker-end="url(#arrow2)">
    <path d="M365 415h100"/>
    <path d="M680 415h100"/>
    <path d="M995 415h100"/>
  </g>

  <g filter="url(#cardShadow)" font-family="PingFang SC,Microsoft YaHei,sans-serif">
    <g transform="translate(95 270)">
      <rect width="270" height="285" rx="28" fill="#fff" stroke="#dce7f6" stroke-width="2"/>
      <circle cx="135" cy="72" r="42" fill="#e8f3ff"/>
      <path d="M112 69h46M112 84h34M118 48h29l15 15v50h-50V48z" fill="none" stroke="#1e80ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="135" y="146" text-anchor="middle" fill="#1d2d45" font-size="29" font-weight="700">掘金触发</text>
      <text x="135" y="190" text-anchor="middle" fill="#738198" font-size="20">新文章勾选</text>
      <text x="135" y="222" text-anchor="middle" fill="#738198" font-size="20">或历史文章按钮</text>
      <rect x="63" y="246" width="144" height="28" rx="14" fill="#edf6ff"/>
      <text x="135" y="266" text-anchor="middle" fill="#2679db" font-size="16">用户主动选择</text>
    </g>
    <g transform="translate(465 270)">
      <rect width="215" height="285" rx="28" fill="#fff" stroke="#dce7f6" stroke-width="2"/>
      <circle cx="108" cy="72" r="42" fill="#edf3ff"/>
      <path d="M84 72h48M108 48v48M89 53l38 38M127 53L89 91" stroke="#507ef2" stroke-width="3.5" opacity=".8"/>
      <text x="108" y="146" text-anchor="middle" fill="#1d2d45" font-size="29" font-weight="700">内容适配</text>
      <text x="108" y="190" text-anchor="middle" fill="#738198" font-size="19">清理主题元数据</text>
      <text x="108" y="222" text-anchor="middle" fill="#738198" font-size="19">保留 GFM 语义</text>
      <text x="108" y="254" text-anchor="middle" fill="#738198" font-size="19">收集外链图片</text>
    </g>
    <g transform="translate(780 270)">
      <rect width="215" height="285" rx="28" fill="#fff" stroke="#dce7f6" stroke-width="2"/>
      <circle cx="108" cy="72" r="42" fill="#ebfbf6"/>
      <path d="M79 83l20-20 16 16 22-27M80 95h57" fill="none" stroke="#24b886" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="108" y="146" text-anchor="middle" fill="#1d2d45" font-size="29" font-weight="700">资源转存</text>
      <text x="108" y="190" text-anchor="middle" fill="#738198" font-size="19">下载掘金图片</text>
      <text x="108" y="222" text-anchor="middle" fill="#738198" font-size="19">上传 CSDN 图床</text>
      <text x="108" y="254" text-anchor="middle" fill="#738198" font-size="19">替换 Markdown URL</text>
    </g>
    <g transform="translate(1095 270)">
      <rect width="350" height="285" rx="28" fill="#fff" stroke="#f1dfe3" stroke-width="2"/>
      <circle cx="175" cy="72" r="42" fill="#fff0f2"/>
      <path d="M148 52h45l12 12v47h-57V52zM160 76h33M160 89h25" fill="none" stroke="#ef5361" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="175" y="146" text-anchor="middle" fill="#1d2d45" font-size="29" font-weight="700">保存 CSDN 草稿</text>
      <text x="175" y="190" text-anchor="middle" fill="#738198" font-size="19">登录检查 · 签名请求</text>
      <text x="175" y="222" text-anchor="middle" fill="#738198" font-size="19">返回草稿地址</text>
      <rect x="101" y="246" width="148" height="28" rx="14" fill="#fff0f2"/>
      <text x="175" y="266" text-anchor="middle" fill="#d74758" font-size="16">不会自动公开发布</text>
    </g>
  </g>

  <g transform="translate(240 665)" font-family="PingFang SC,Microsoft YaHei,sans-serif">
    <rect width="1120" height="118" rx="28" fill="#14253d"/>
    <text x="48" y="49" fill="#9cb2cb" font-size="20">任务状态</text>
    <text x="48" y="86" fill="#eef5ff" font-size="24" font-weight="600">等待同步</text>
    <text x="198" y="86" fill="#68819f" font-size="26">→</text>
    <text x="245" y="86" fill="#eef5ff" font-size="24" font-weight="600">检查登录</text>
    <text x="405" y="86" fill="#68819f" font-size="26">→</text>
    <text x="452" y="86" fill="#eef5ff" font-size="24" font-weight="600">处理内容</text>
    <text x="610" y="86" fill="#68819f" font-size="26">→</text>
    <text x="657" y="86" fill="#eef5ff" font-size="24" font-weight="600">保存草稿</text>
    <text x="815" y="86" fill="#68819f" font-size="26">→</text>
    <text x="862" y="86" fill="#62e0ad" font-size="24" font-weight="700">成功</text>
    <text x="943" y="86" fill="#68819f" font-size="22">/</text>
    <text x="975" y="86" fill="#ff8590" font-size="24" font-weight="700">可重试失败</text>
  </g>
</svg>
