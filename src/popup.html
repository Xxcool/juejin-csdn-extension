<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>文章摆渡</title>
</head>
<body>
  <main>
    <header id="app-header">
      <div class="brand">
        <img class="brand-icon" src="logo.svg" alt="文章摆渡 Logo">
        <strong id="page-title">文章摆渡</strong>
      </div>
      <button id="login-state" class="platform-pill checking" title="点击检查或登录 CSDN" aria-label="CSDN 状态">
        <span class="platform-dot"></span>
        <span id="login-text" class="platform-text">检测中…</span>
      </button>
    </header>

    <nav class="app-tabs" role="tablist">
      <button id="tab-history" class="tab-button active" data-tab="history" role="tab" aria-selected="true" aria-controls="pane-history">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6"/><path d="M4 4v4.6h4.6M12 8v4l2.8 1.8"/></svg>
        <span>同步记录</span>
        <span id="history-badge" class="tab-badge">0</span>
      </button>
      <button id="tab-settings" class="tab-button" data-tab="settings" role="tab" aria-selected="false" aria-controls="pane-settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.8 3.6h4.4l.7 2.2 2 .9 2.1-1 2.2 3.8-1.6 1.7.2 2.2 1.4 1.7-2.2 3.8-2.2-.7-1.8 1.3-.5 2.3H9.8l-.7-2.2-2-.9-2.1 1-2.2-3.8 1.6-1.7-.2-2.2-1.4-1.7L5 5.2l2.2.7z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>偏好设置</span>
      </button>
    </nav>

    <section id="pane-history" class="tab-pane active" role="tabpanel" aria-labelledby="tab-history">
      <div class="history-toolbar">
        <div class="history-filters" role="group" aria-label="筛选同步记录">
          <button class="filter-chip active" data-filter="all">全部</button>
          <button class="filter-chip" data-filter="saved">成功</button>
          <button class="filter-chip" data-filter="failed">失败</button>
          <button class="filter-chip" data-filter="working">进行中</button>
        </div>
        <div class="history-actions-bar">
          <span id="history-count">0 篇</span>
          <button id="history-retry-all" class="text-btn" disabled>重试失败</button>
          <button id="history-clear" class="text-btn danger" disabled>清空</button>
        </div>
      </div>
      <div id="task-list" class="task-list"></div>
    </section>

    <section id="pane-settings" class="tab-pane" role="tabpanel" aria-labelledby="tab-settings">
      <div class="settings-scroll">
        <div class="settings-group">
          <span class="settings-kicker">同步与发布行为</span>
          <label class="setting-item">
            <span class="setting-text">
              <b>发布后自动勾选同步</b>
              <small>掘金发布面板中的 CSDN 选项默认开启</small>
            </span>
            <input id="auto-sync" type="checkbox">
            <i class="switch"></i>
          </label>
          <label class="setting-item">
            <span class="setting-text">
              <b>同步文章封面</b>
              <small>关闭后仅转存正文图片，不迁移封面图</small>
            </span>
            <input id="sync-cover" type="checkbox">
            <i class="switch"></i>
          </label>
          <label class="setting-item">
            <span class="setting-text">
              <b>更新草稿前二次确认</b>
              <small>已有 CSDN 草稿时，暂停并等待手动确认</small>
            </span>
            <input id="confirm-update" type="checkbox">
            <i class="switch"></i>
          </label>
          <label class="field-item">
            <span class="field-label">图片转存失败策略</span>
            <select id="image-failure" class="select-input">
              <option value="continue">保留原外链地址并继续同步草稿</option>
              <option value="abort">终止本次同步任务并报错</option>
            </select>
          </label>
        </div>

        <div class="settings-group">
          <span class="settings-kicker">分类与标签映射</span>
          <label class="field-item">
            <span class="field-label">默认 CSDN 分类</span>
            <input id="default-category" class="text-input" maxlength="40" placeholder="例如：前端 / 后端 / 架构">
          </label>
          <label class="field-item">
            <span class="field-label">掘金标签 → CSDN 分类映射</span>
            <textarea id="category-mappings" class="textarea-input" rows="3" placeholder="JavaScript = 前端&#10;Vue.js = 前端&#10;Go = 后端"></textarea>
            <small class="field-hint">每行一条“掘金标签 = CSDN 分类”，命中时优先归类。</small>
          </label>
        </div>

        <div class="notice-card">
          <div class="notice-title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span>安全与隐私原则</span>
          </div>
          <p>任务记录仅保存在当前 Chrome；插件不收集、不存储用户账号密码凭据，CSDN 仅生成草稿不会自动公开发布。</p>
          <div class="notice-footer">
            <span id="app-version">版本 v0.5.0</span>
            <a href="https://github.com/Xxcool/juejin-csdn-extension" target="_blank" rel="noreferrer">GitHub 开源 ↗</a>
          </div>
        </div>
      </div>
    </section>

    <div id="toast" role="status"></div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
